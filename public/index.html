<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark" data-accent="sage">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cmail — صندوق ایمیل آرام شما</title>
  <meta name="description" content="Cmail — پلتفرم ایمیل روی Cloudflare: ایمیل موقت و دائمی، یادداشت‌گذاری روی ایمیل‌ها، گاوصندوق کدهای 2FA و پشتیبانی چند دامنه." />
  <meta name="theme-color" content="#141a15" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/img/favicon-64.png" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <!-- calm background -->
  <div class="bg-calm" aria-hidden="true"><div class="grain"></div></div>

  <!-- sidebar (desktop) -->
  <aside class="sidebar" id="sidebar" hidden>
    <div class="sidebar__brand">
      <img class="sidebar__logo" src="assets/img/icon-white.png" alt="Cmail" />
      <span class="sidebar__name">Cmail</span>
      <span class="sidebar__ver">1.9</span>
    </div>
    <div class="sidebar__tag" id="sb-tag"></div>

    <div class="sidebar__label" id="sb-label"></div>
    <nav class="sidebar__nav" id="sb-nav"></nav>

    <div class="sidebar__quote" id="sb-quote" hidden>
      <span class="icn" data-quote-icon></span>
      <b id="sb-quote-t"></b>
      <span id="sb-quote-s"></span>
    </div>

    <button class="sidebar__user" id="sb-user" hidden></button>
  </aside>
  <div class="sidebar-scrim" id="sb-scrim" hidden></div>

  <!-- main column -->
  <div class="main" id="main">
    <header class="topbar" id="topbar" hidden>
      <button class="icon-btn" data-mobile="menu" id="tb-menu" aria-label="menu" hidden></button>
      <div class="topbar__title" id="tb-title"></div>
      <div class="topbar__end" id="tb-end"></div>
    </header>
    <main class="view" id="app" aria-live="polite"></main>
  </div>

  <!-- mobile tabbar -->
  <nav class="tabbar" id="tabbar" hidden><div class="tabbar__in" id="tabbar-in"></div></nav>

  <!-- overlays -->
  <div class="toasts" id="toasts" aria-live="assertive"></div>
  <div class="modal-root" id="modals"></div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
