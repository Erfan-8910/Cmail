<svg xmlns="http://www.w3.org/2000/svg" width="162" height="28" role="img" aria-label="version: v2.7.0">
  <defs>
    <linearGradient id="live" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f9e63"/>
      <stop offset="1" stop-color="#3fae74"/>
    </linearGradient>
  </defs>
  <clipPath id="r"><rect width="162" height="28" rx="8"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="162" height="28" fill="#0b0f14"/>
    <rect width="92" height="28" fill="url(#live)"/>
  </g>
  <!-- the breathing dot: the release is alive -->
  <circle cx="9" cy="14" r="3" fill="#eaf7ee">
    <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2.6;3.3;2.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="18" y="18.5" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#e8f5ec">version</text>
  <text x="104" y="18.5" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e9efeb">v2.7.0</text>
</svg>
